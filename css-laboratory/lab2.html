<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 2: CSS Selectors</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <h1 id="page-title">CSS Selectors</h1>

    <p>This paragraph is outside the cards.</p>
    <p>Selectors let us target specific elements.</p>
    <p class="highlight">This paragraph uses a separate class.</p>

    <div class="card">
        <h2>Card One</h2>
        <p>Content of the first card.</p>
    </div>

    <div class="card">
        <h3>Card Two</h3>
        <p>Content of the second card.</p>
    </div>

    <div class="card">
        <h2>Card Three</h2>
        <p>Content of the third card.</p>
    </div>
</body>
