<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First CSS Page</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        h1 {
            color: darkblue;
        }
    </style>
</head>
<body>
    <h1>My First CSS Page</h1>

    <p style="font-style: italic;">CSS (Cascading Style Sheets) is a stylesheet language used to control the presentation and layout of HTML documents.</p>

    <p>Without CSS, a webpage generally displays content using the browser's default styles. CSS allows developers to create attractive, consistent designs.</p>
</body>
</html>
