<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <input type="text" name="" id="">
    <input type="email" name="" id="">
    <input type="password" name="" id="">
    <input type="checkbox" name="" id="">
    <input type="radio" name="" id="">
    <input type="submit" value="">
    <br>

    <form>  
            <div>
                <br>
            <label for="studentID">Student ID:</label>
            <br>
            <input type="text" name="studentID" id="studentID">
            <br>
            <label for="firstName">First Name:</label>
            <br>
            <input type="text" name="firstName" id="firstName">
            <br>
            <label for="lastName">Last Name:</label>
            <br>
            <input type="text" name="lastName" id="lastName">
            <br>
            <label for="address">Address:</label>
            <br>
            <input type="text" name="address" id="address">
            <br>
            <label for="email">Email:</label>
            <br>
            <input type="email" name="email" id="email">
            <br>
            <label for="password">Password:</label>
            <br>
            <input type="password" name="password" id="password">
            <br>
            <label for="gender">Gender:</label>
            <br>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
            <br>
            <label for="hobbies">Hobbies:</label>
            <br>
            <input type="checkbox" name="hobbies" id="hobby1">
            <label for="hobby1">basketballball</label>
            <input type="checkbox" name="hobbies" id="hobby2">
            <label for="hobby2">gamer yarn</label>
            <input type="checkbox" name="hobbies" id="hobby3">
            <label for="hobby3">mag jakstone</label>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
